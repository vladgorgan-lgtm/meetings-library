<!DOCTYPE html>
<!-- Meeting Library viewer. Static and data-free: safe to share, diff and upgrade.
     Data comes from data/library.js (generated, private). -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/app.css">
</head><body>

<button class="menu" id="menu">&#9776; Meetings</button>
<div class="app">
<aside id="side">
  <div class="shead">
    <div class="brand" id="brand" data-clear="1">Meeting Library</div>
    <input id="q" placeholder="Search everything&hellip;" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div id="sbar"></div>
  </div>
  <div class="slist" id="slist"></div>
</aside>
<main id="main"><div class="inner" id="pane"></div></main>
</div>

<!-- data first (script, not fetch: Chrome blocks fetch() on file://), then the app -->
<script src="data/library.js"></script>
<script src="ui/app.js"></script>
<script src="ui/settings.js"></script>
</body></html>
